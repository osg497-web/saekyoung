<title>Willog - 로고 모션</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    background-color: #1E6DE0;
    overflow: hidden;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .full-logo {
    width: 210px;
    height: auto;
    overflow: visible;
  }

  .symbol-group {
    transform-box: fill-box;
    transform-origin: center;
    transform: translate(54.72px, 1.5px) scale(1.95);
    transition: transform 1s cubic-bezier(.16,.8,.24,1);
  }
  .symbol-group.settled {
    transform: translate(0px, 0px) scale(1);
  }

  .text-path {
    opacity: 0;
    transform: translateX(-5px);
    transition: opacity 0.5s ease, transform 0.5s ease;
  }
  .text-path.show {
    opacity: 1;
    transform: translateX(0);
  }
</style>

<script>
  function playIntro() {
    const symbolGroup = document.getElementById('symbolGroup');
    const textPaths = document.querySelectorAll('.text-path');

    symbolGroup.classList.remove('settled');
    textPaths.forEach(p => p.classList.remove('show'));

    setTimeout(() => {
      symbolGroup.classList.add('settled');
      textPaths.forEach((p, i) => {
        setTimeout(() => { p.classList.add('show'); }, 350 + i * 85);
      });
    }, 900);
  }

  playIntro();
  setInterval(playIntro, 4400);
</script>
