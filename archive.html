<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Archive — SaeKyoung</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;1,9..144,400&family=Iceland&family=Passero+One&family=Menbere:wght@400;600;700&family=Manuale:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#000000;
    --bg-soft:#141311;
    --panel:#171613;
    --text:#f3f1ea;
    --text-dim:#8f8b80;
    --text-faint:#5c584f;
    --accent:#c9a961;
    --line:rgba(243,241,234,0.12);
    --line-strong:rgba(243,241,234,0.22);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Pretendard', -apple-system, sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  ::selection{background:var(--accent);color:#0b0b0a;}
  a{color:inherit;text-decoration:none;}
  .serif{font-family:'Fraunces', serif;}

  .sidebar{
    position:fixed;top:0;left:0;bottom:0;width:380px;
    background:#000000;
    border-right:1px solid var(--line);
    display:flex;flex-direction:column;
    padding:36px 30px 22px;
    z-index:200;
  }
  .sb-brand{font-family:'Manuale','Pretendard',sans-serif;font-size:24px;font-weight:700;letter-spacing:-0.01em;display:inline-block;transition:color .25s;}
  .sb-brand:hover{color:var(--accent);}
  .sb-nav{margin-top:56px;display:flex;flex-direction:column;gap:5px;}
  .sb-nav a{
    font-family:'Manuale','Pretendard',sans-serif;font-size:26px;font-weight:400;color:var(--text);letter-spacing:0em;
    padding:0;transition:color .25s, transform .25s;display:inline-block;
  }
  .sb-nav a:hover{color:var(--accent);transform:translateX(4px);}
  .sb-nav a.active{color:var(--accent);}
  .sb-cards{margin-top:20px;display:flex;flex-direction:column;gap:12px;overflow-y:auto;overflow-x:hidden;padding-right:2px;}
  .sb-card{
    display:block;background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:16px 18px;transition:background .25s, border-color .25s, transform .25s;
  }
  .sb-card:hover{background:#1f1c18;border-color:var(--line-strong);transform:translateX(3px);}
  .sb-card .t{font-family:'Manuale','Pretendard',sans-serif;font-size:14.5px;font-weight:600;color:var(--text);}
  .sb-card .s{font-size:12.5px;color:var(--text-dim);margin-top:3px;}
  .sb-foot{margin-top:auto;padding-top:26px;}
  .sb-clock{
    font-family:'Manuale','Pretendard',sans-serif;font-size:32px;font-weight:400;font-variant-numeric:tabular-nums;letter-spacing:0.01em;
  }
  .sb-status{
    margin-top:18px;padding-top:14px;border-top:1px solid var(--line);
    display:flex;align-items:center;justify-content:space-between;
    font-size:12px;color:var(--text-dim);
  }
  .sb-status .loc{display:flex;align-items:center;gap:8px;}
  .sb-status .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);}

  main{margin-left:380px;}

  .section{padding:120px 40px 140px;}
  .section-head{
    display:flex;justify-content:space-between;align-items:baseline;
    margin-bottom:60px;flex-wrap:wrap;gap:20px;
    border-bottom:1px solid var(--line);
    padding-bottom:28px;
  }
  .section-label{
    font-size:13px;letter-spacing:0.14em;text-transform:uppercase;color:var(--text-dim);
    display:flex;align-items:center;gap:10px;
  }
  .section-label::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--accent);}
  .section-title{font-family:'Fraunces',serif;font-size:clamp(28px,4vw,46px);font-weight:400;}
  .section-note{margin-top:-30px;margin-bottom:60px;font-size:14px;color:var(--text-dim);}

  .archive-grid{
    display:grid;grid-template-columns:repeat(3, 1fr);gap:20px;
    filter:grayscale(0.15);
  }
  .archive-grid img{
    width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:12px;
    opacity:0.55;filter:grayscale(0.5);
    transition:opacity .3s, filter .3s;
  }
  .archive-grid img:hover{opacity:0.9;filter:grayscale(0);}

  footer{padding:100px 40px 50px;border-top:1px solid var(--line);margin-top:60px;}
  .contact-links{display:flex;flex-direction:column;gap:10px;font-size:15px;}
  .contact-links a{display:inline-flex;align-items:center;gap:8px;color:var(--text-dim);transition:color .25s;}
  .contact-links a:hover{color:var(--accent);}
  .footer-meta{font-size:12px;color:var(--text-faint);margin-top:20px;}

  @media(max-width:860px){
    .sidebar{
      position:relative;width:100%;height:auto;border-right:none;border-bottom:1px solid var(--line);
      padding:26px 20px 24px;
    }
    .sb-cards{max-height:none;}
    main{margin-left:0;}
    .section{padding:70px 20px 90px;}
    .archive-grid{grid-template-columns:repeat(2, 1fr);gap:12px;}
    footer{padding:70px 20px 40px;}
  }


  /* ---------- contact modal ---------- */
  .contact-modal-overlay{
    position:fixed;inset:0;background:rgba(0,0,0,0.6);backdrop-filter:blur(4px);
    z-index:10000;display:none;align-items:center;justify-content:center;padding:20px;
  }
  .contact-modal-overlay.open{display:flex;}
  .contact-modal{
    background:#ffffff;color:#171613;border-radius:20px;max-width:440px;width:100%;
    padding:36px 32px 32px;position:relative;box-shadow:0 30px 70px rgba(0,0,0,0.45);
    font-family:'Pretendard',sans-serif;
  }
  .contact-modal .close-btn{
    position:absolute;top:18px;right:18px;background:none;border:none;font-size:20px;
    color:#888;cursor:pointer;line-height:1;padding:6px;
  }
  .contact-modal .close-btn:hover{color:#171613;}
  .contact-modal h2{font-size:23px;font-weight:700;margin-bottom:8px;}
  .contact-modal .sub{font-size:13.5px;color:#8a8a8a;margin-bottom:26px;}
  .contact-modal label{display:block;font-size:13px;font-weight:600;margin-bottom:8px;margin-top:18px;color:#222;}
  .contact-modal label:first-of-type{margin-top:0;}
  .contact-modal input, .contact-modal textarea{
    width:100%;padding:12px 14px;border:1px solid #e3e2de;border-radius:10px;background:#f6f5f2;
    font-family:'Pretendard',sans-serif;font-size:14px;color:#171613;outline:none;transition:border-color .2s;
  }
  .contact-modal input:focus, .contact-modal textarea:focus{border-color:#171613;}
  .contact-modal textarea{min-height:100px;resize:vertical;}
  .contact-modal button.send-btn{
    margin-top:24px;width:100%;padding:14px;border:none;border-radius:10px;background:#171613;color:#fff;
    font-size:14.5px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;
    transition:background .2s;font-family:'Pretendard',sans-serif;
  }
  .contact-modal button.send-btn:hover{background:#333;}
</style>
</head>
<body>

<aside class="sidebar">
  <a class="sb-brand" href="index.html">SaeKyoung</a>

  <nav class="sb-nav">
    <a href="info.html">Info</a>
    <a href="index.html#work">Work</a>
    <a href="#" onclick="openContactModal();return false;">Contact me</a>
  </nav>

  <div class="sb-cards">
    <a class="sb-card" href="willog.html">
      <div class="t">Willog</div>
      <div class="s">BX Design</div>
    </a>
    <a class="sb-card" href="soun.html">
      <div class="t">소운탕</div>
      <div class="s">Brand Identity &amp; Spatial</div>
    </a>
    <a class="sb-card" href="ohi.html">
      <div class="t">Ohi</div>
      <div class="s">Brand Identity &amp; Product</div>
    </a>
  </div>

  <div class="sb-foot">
    <div class="sb-clock" id="clock">--:--:--</div>
    <div class="sb-status">
      <span class="loc"><span class="dot"></span>Seoul, KR</span>
      <span id="weather">—</span>
    </div>
  </div>
</aside>

<main>

<section class="section">
  <div class="section-head">
    <div class="section-label">Archive</div>
    <div class="section-title">Coming soon</div>
  </div>
  <p class="section-note">레퍼런스, 영감, 지난 작업들을 모아두는 공간이에요. 하나씩 채워나갈게요.</p>

  <div class="archive-grid">
    <img src="https://osg497-web.github.io/research-calendar.png" alt="">
    <img src="https://osg497-web.github.io/illust-couple.png" alt="">
    <img src="https://osg497-web.github.io/door-illust.png" alt="">
    <img src="https://osg497-web.github.io/gesture.png" alt="">
    <img src="https://osg497-web.github.io/video.png" alt="">
    <img src="https://osg497-web.github.io/tomvagee-portrait.png" alt="">
  </div>
</section>

<footer>
  <div class="footer-meta">© 2026 SaeKyoung. All rights reserved.</div>
</footer>

<script>
  function updateClock(){
    const now = new Date();
    const seoul = new Intl.DateTimeFormat('en-GB', {
      timeZone:'Asia/Seoul', hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:false
    }).format(now);
    document.getElementById('clock').textContent = seoul;
  }
  updateClock();
  setInterval(updateClock, 1000);

  fetch('https://api.open-meteo.com/v1/forecast?latitude=37.5665&longitude=126.9780&current_weather=true')
    .then(r => r.json())
    .then(d => {
      const t = Math.round(d.current_weather.temperature);
      document.getElementById('weather').textContent = t + '°C';
    })
    .catch(() => { document.getElementById('weather').textContent = ''; });
</script>

</main>


<div class="contact-modal-overlay" id="contactOverlay">
  <div class="contact-modal">
    <button class="close-btn" type="button" onclick="closeContactModal()">✕</button>
    <h2>Let's work together 👋</h2>
    <p class="sub">메시지를 보내주시면 빠르게 답장드릴게요!</p>
    <form id="contactForm">
      <label for="cName">Name</label>
      <input type="text" id="cName" placeholder="Your name" required>
      <label for="cEmail">Email</label>
      <input type="email" id="cEmail" placeholder="your@email.com" required>
      <label for="cMessage">Message</label>
      <textarea id="cMessage" placeholder="Hey SaeKyoung, nice to meet you..." required></textarea>
      <button type="submit" class="send-btn">Send Message →</button>
    </form>
  </div>
</div>

<script>
  function openContactModal(){
    document.getElementById('contactOverlay').classList.add('open');
  }
  function closeContactModal(){
    document.getElementById('contactOverlay').classList.remove('open');
  }
  document.getElementById('contactOverlay').addEventListener('click', function(e){
    if(e.target.id === 'contactOverlay') closeContactModal();
  });
  document.getElementById('contactForm').addEventListener('submit', function(e){
    e.preventDefault();
    const name = document.getElementById('cName').value;
    const email = document.getElementById('cEmail').value;
    const message = document.getElementById('cMessage').value;
    const subject = encodeURIComponent('[Portfolio Contact] ' + name);
    const body = encodeURIComponent('이름: ' + name + '\n이메일: ' + email + '\n\n' + message);
    window.location.href = 'mailto:osg497@gmail.com?subject=' + subject + '&body=' + body;
    closeContactModal();
  });
</script>
</body>
</html>
